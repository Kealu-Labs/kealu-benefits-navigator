[project]
name = "kealu-benefits-navigator"
version = "0.1.0"
description = "Benefit & Insurance Navigator — multi-agent system that discovers government benefits and insurance plans, validates eligibility, and produces enrollment action plans"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
forms = [
    "pypdf>=4.0",
    # pypdf delegates AES to `cryptography`; without it, reading the AESV2-
    # encrypted Spanish CDSS form raises "cryptography>=3.1 is required for
    # AES algorithm". Declared explicitly rather than relying on pypdf's
    # extra name, which has moved between releases.
    "cryptography>=3.1",
]
dev = [
    "pypdf>=4.0",
    "cryptography>=3.1",
    "pytest>=8.0",
    "pytest-bdd>=7.0",
]

[project.scripts]
benefits-navigator = "benefits_navigator.mcp_server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: live CMS Marketplace API tests (require CMS_API_KEY)",
    "allow_log_output: test intentionally emits log lines; assertions cover them via caplog",
]
addopts = "-m 'not integration'"

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
