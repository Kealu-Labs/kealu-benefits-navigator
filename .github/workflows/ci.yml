#
# CI — type-check, lint, unit/API tests, build, Python suite, and browser E2E.
#
# Shape follows counslr-sos (hardened runner, SHA-pinned actions, per-ref
# concurrency, least-privilege token). Two deliberate differences are noted
# inline: the pull_request trigger is NOT restricted to `main`, and checks are
# spelled out here rather than behind a Makefile, which this repo does not have.

name: CI

on:
  push:
    branches: [main]
  # NOTE: deliberately no `branches:` filter here. The contractor on this repo
  # opens stacked PRs against his own fork's feature branches, never against
  # `main`. A base-branch filter (as counslr-sos uses) would silently never
  # fire for those PRs — the failure mode is a green board that ran nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit / API / integration tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: python — pytest
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Installs from pyproject extras, NOT requirements*.lock: the lock files
      # omit pypdf and cryptography entirely, so a lock-based install fails 27
      # tests on the AESV2-encrypted Spanish CDSS form. See the pyproject change
      # in this PR, which makes the declaration match what the suite needs.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      # `addopts = -m 'not integration'` already excludes the live CMS API
      # tests, so no CMS_API_KEY is needed here.
      - name: Run pytest
        run: pytest -q

  e2e:
    name: e2e — playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      # Runs every configured project. On branches carrying the SAWS-2 work
      # that is both `chromium` and `saws2`; a spec routed to the wrong project
      # fails deterministically, which is the point of running all of them.
      - name: Run Playwright
        run: npx playwright test

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
