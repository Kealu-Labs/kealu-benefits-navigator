#
# CI — type-check, lint, unit/API tests, build, Python suite, and browser E2E.
#
# Shape follows counslr-sos (hardened runner, SHA-pinned actions, per-ref
# concurrency, least-privilege token). Two deliberate differences are noted
# inline: the pull_request trigger is NOT restricted to `main`, and checks are
# spelled out here rather than behind a Makefile, which this repo does not have.

name: CI

on:
  push:
    branches: [main]
  # NOTE: deliberately no `branches:` filter here. The contractor on this repo
  # opens stacked PRs against his own fork's feature branches, never against
  # `main`. A base-branch filter (as counslr-sos uses) would silently never
  # fire for those PRs — the failure mode is a green board that ran nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit / API / integration tests
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: python — pytest
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Installs from pyproject extras, NOT requirements*.lock: the lock files
      # omit pypdf and cryptography entirely, so a lock-based install fails 27
      # tests on the AESV2-encrypted Spanish CDSS form. See the pyproject change
      # in this PR, which makes the declaration match what the suite needs.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      # `addopts = -m 'not integration'` already excludes the live CMS API
      # tests, so no CMS_API_KEY is needed here.
      - name: Run pytest
        run: pytest -q

  # NOTE: no `e2e` job yet, deliberately.
  #
  # The Playwright specs in web/tests/e2e/ select on `data-testid` attributes
  # (48 references in intake-to-report.spec.ts alone) that DO NOT EXIST in
  # web/src/ on main -- the specs landed without the component attributes they
  # depend on, and nothing caught it because this repo has never had CI. The
  # suite therefore cannot pass here, whatever the runner does. The app itself
  # is fine: the dev server returns 200 and renders correctly.
  #
  # Adding the job anyway would produce a permanently red check, which is the
  # same failure this workflow exists to prevent -- a board people learn to
  # ignore -- just inverted. The attributes arrive with the in-flight SAWS-2
  # branch, and the job should be added back in the same change that lands them.
