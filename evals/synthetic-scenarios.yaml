#
# Five synthetic eligibility scenarios for the Benefits Navigator eval harness.
# Commissioned by Stefan 2026-08-26: "5 synthetic scenarios including 3 focusing
# on Austin."
#
# SYNTHETIC BY RULING. No real applicant data, ever. The corpus decision went
# this way partly because scoring against stored real runs points BACKWARDS:
# where BN is currently wrong, the stored run makes the wrong answer golden and
# a better model scores as a regression.
#
# ============================ READ THIS FIRST ============================
# EVERY `expected` BLOCK IS DELIBERATELY UNPOPULATED.
#
# A synthetic scenario's entire value is a known-correct outcome. Correct
# outcomes cannot be derived from the tables this repo currently ships:
#
#   - contexts/community/benefits-navigator.md carries the "2025 HHS Poverty
#     Guidelines". It is 2026. Thresholds rise annually, so the shipped tables
#     understate eligibility.
#   - The same file's "Medicaid Expansion Status (as of 2025)" list is likewise
#     unverified against today, and by that document's own account expansion
#     status is "the single largest state-by-state eligibility variable".
#
# Populating expectations from those tables would write wrong answers, label
# them golden, and MANUFACTURE the enshrined-wrong-answer problem that choosing
# synthetic was meant to avoid -- deliberately, and with our signature on it.
#
# Structure and ground truth are separable. Only ground truth is blocked.
# Expected values are unblocked by ONE thing: current HHS poverty guidelines and
# current expansion status, sourced from the published federal tables and
# checked by a person. Do not infer them, and do not let a harness treat an
# unpopulated or stale `expected` block as ground truth -- it must fail or skip
# loudly, never silently pass.
# =========================================================================

meta:
  status: assertions_encoded_inputs_pending_sanity_check
  # Blocking is PER-ASSERTION, not per-scenario. A case may sit on a boundary and
  # block only the assertions that turn on it, keeping the rest live -- so the
  # corpus never has to be distorted to fit what we can currently verify.
  # Blocked is a QUEUE, not a bin: an assertion we want but cannot yet ground is
  # blocked (visible, attached to its unblocking condition, excluded from the
  # denominator), never deleted.
  expected_values_blocked_on: >-
    Human-verified current HHS poverty guidelines and current Medicaid
    expansion status. See EMBEDDED_FPL_GUIDELINE_YEAR in web/src/lib/fpl-vintage.ts.
  measures: eligibility_determination_correctness

# ---------------------------------------------------------------------------
# AUSTIN, TEXAS (3 of 5, per the ruling).
#
# Texas has NOT expanded Medicaid. That is not a different ZIP against the same
# logic -- it is a different eligibility PATH. In non-expansion states adults
# below 100% FPL fall into the "coverage gap": too much income for traditional
# Medicaid, too little for ACA subsidies, which begin AT 100% FPL. They qualify
# for nothing through either route.
#
# All three cluster around the 100% FPL boundary on purpose. That boundary is
# both the highest-stakes decision the product makes and the exact number the
# stale tables get wrong -- stale lower thresholds make income read as a HIGHER
# percentage of FPL, so a person genuinely inside the gap can read as just over
# it and be told they qualify for subsidies they cannot actually get.
# ---------------------------------------------------------------------------

scenarios:
  - id: austin-gap-childless-adult
    location: {city: Austin, state: TX, zip: "78702"}
    household: {size: 1, composition: "single adult, no children, no disability"}
    income_position: "well below 100% FPL"
    exercises:
      - Coverage gap detection in a non-expansion state
      - Childless adult with no categorical pathway -- the harshest real outcome
      - Whether BN states plainly that nothing is available rather than implying hope
    why_this_case: >-
      The case the product is most likely to get wrong in the most damaging
      direction. If BN suggests marketplace subsidies here, it sends someone
      with no options to an application that will be denied.
    input: {annual_income: 8000}   # ~51% of the 2025 HH-1 figure ($15,650); ~43% even under
                                   # an implausible 20% rise. Asserting the value is nowhere
                                   # NEAR the threshold, not where the threshold is.
                                   # PENDING human sanity-check with the HHS sourcing.
    assertions:
      - {id: no-marketplace, kind: must_not_include, field: outcome.programs, value: marketplace_subsidy}
      - {id: names-the-gap, kind: must_mention_any, field: outcome.explanation,
         any_of: ["coverage gap", "has not expanded Medicaid"]}
      - {id: fpl-dated, kind: conditional_presence,
         when_present: outcome.fpl_percentage, must_accompany: outcome.guideline_year}
      - {id: exact-programs, kind: equals, field: outcome.programs,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}

  - id: austin-gap-split-household
    location: {city: Austin, state: TX, zip: "78744"}
    household: {size: 3, composition: "one adult, two children aged 6 and 9"}
    income_position: "just below 100% FPL"
    exercises:
      - Split outcome within one household -- children eligible, adult in the gap
      - CHIP / children's Medicaid thresholds, which sit far above adult ones
      - Whether BN reports a partial result clearly instead of one verdict
    why_this_case: >-
      A very common real pattern and easy to get wrong in either direction:
      declaring the whole household ineligible, or implying the adult is
      covered because the children are.
    assertions:
      # Robust BECAUSE it is relational: children's thresholds sit far above any
      # adult pathway, so the outcomes differ on EITHER side of 100% FPL. Only the
      # adult's specific status turns on where the threshold falls.
      - {id: split, kind: must_differ_within,
         field_a: outcome.members.adult, field_b: outcome.members.children}
      - {id: names-the-gap, kind: must_mention_any, field: outcome.explanation,
         any_of: ["coverage gap", "has not expanded Medicaid"]}
      - {id: adult-gap-status, kind: equals, field: outcome.members.adult,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}

  - id: austin-boundary-just-over
    location: {city: Austin, state: TX, zip: "78741"}
    household: {size: 3, composition: "two adults, one child"}
    income_position: "just above 100% FPL"
    exercises:
      - The subsidy-eligibility boundary at exactly 100% FPL
      - Cost-sharing reductions in the band above it
      - Sensitivity to FPL table vintage -- this case FLIPS on a stale table
    why_this_case: >-
      Deliberately placed on the margin the stale tables move. Under the 2025
      tables this household reads differently than under current ones, which
      makes it the canary for guideline staleness as well as an eligibility test.
    # BLOCKED BY CONSTRUCTION, and that is the canary working rather than a gap.
    # A case designed to sit ON the margin cannot have a robust input: a value
    # unambiguous under both tables is by definition not on the boundary.
    # Do not "fix" this by moving the scenario.
    assertions:
      # Anchored to the RUN's date, never to anything in this repo -- an expected
      # value read from the repo can pass while both halves are stale. A false
      # alarm in early January (before HHS publishes) is deliberate: an
      # unnecessary notice costs a sentence, a missing one costs someone their
      # benefits. Do not loosen this.
      - {id: fpl-vintage-current, kind: equals, field: outcome.guideline_year,
         expected_from: run_year}
      - {id: fpl-dated, kind: conditional_presence,
         when_present: outcome.fpl_percentage, must_accompany: outcome.guideline_year}
      # NOT COVERED by the two above, and it is the worse failure: whether the
      # FIGURES used match the vintage claimed. A hallucinated vintage is worse
      # than an undated one -- confidently wrong, honest signal overwritten.
      - {id: figures-match-vintage, kind: equals, field: outcome.fpl_percentage,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}
      - {id: boundary-outcome, kind: equals, field: outcome.programs,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}

  # -------------------------------------------------------------------------
  # NON-AUSTIN (2 of 5). These are the only non-Texas coverage in the set, so
  # they are chosen for CONTRAST rather than convenience: one exercises the
  # opposite side of the expansion branch, the other a household shape and
  # income band the Austin three do not reach.
  # -------------------------------------------------------------------------

  - id: expansion-state-mirror
    location: {city: Fresno, state: CA, zip: "93706"}
    household: {size: 1, composition: "single adult, no children, no disability"}
    income_position: "same FPL position as austin-gap-childless-adult"
    exercises:
      - The expansion side of the largest branch in the system
      - That an identical household gets an OPPOSITE answer purely on state
      - The California state adapter (SAWS), which is the only one implemented
    why_this_case: >-
      A deliberate mirror of the first Austin case. Same household, same income
      position, different state. If BN returns the same answer for both, it has
      not applied expansion status at all -- which no aggregate score would
      reveal, but this pair makes unmissable.
    input: {annual_income: 8000}   # identical to austin-gap-childless-adult by design
    assertions:
      # BLOCKED, not dropped. "California has expanded" is a genuinely useful
      # absolute check on this case -- but it would import an unverified fact from
      # the same 2025 list into an assertion treated as authoritative. The failure
      # would be a false alarm rather than a false pass, but that sets the
      # precedent that "structurally safe" is enough to assert on. The must_differ
      # relation carries this case without the assumption, so blocking costs
      # nothing today and keeps the assertion queued rather than forgotten.
      - {id: has-medicaid, kind: must_include, field: outcome.programs, value: medicaid,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}
      - {id: exact-programs, kind: equals, field: outcome.programs,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}

  - id: older-couple-chronic-condition
    location: {city: Fresno, state: CA, zip: "93720"}
    household: {size: 2, composition: "couple aged 58 and 61, one with a chronic condition"}
    income_position: "around 250% FPL"
    exercises:
      - The CSR boundary at 250% FPL, a different threshold from the others
      - The medications and providers inputs, which no other scenario populates
      - Pre-Medicare older adults, a household shape absent from the Austin three
    why_this_case: >-
      Covers input fields and an income band the rest of the set never touches.
      Also the only case where provider-network and prescription matching
      matter, which is a large part of what the product actually outputs.
    assertions:
      - {id: meds-considered, kind: must_mention_any, field: outcome.explanation,
         any_of: ["prescription", "medication", "formulary"]}
      - {id: csr-band, kind: equals, field: outcome.cost_sharing_reduction,
         expected: BLOCKED_PENDING_VERIFIED_TABLES}

relations:
  # Identical household, identical income, opposite side of the largest branch in
  # the system. Needs NO ground truth: "these must differ" does not require
  # knowing what either should be. If BN returns the same answer for both, it has
  # not applied expansion status at all -- which no aggregate score would reveal.
  - {id: expansion-branch-applied, kind: must_differ,
     of: austin-gap-childless-adult, with: expansion-state-mirror,
     field: outcome.programs}
